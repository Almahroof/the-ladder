name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it, so a half-published
# site never ends up live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `enablement: true` turns Pages on for the repository on the first run,
      # so there is no manual step in Settings before the site can go live.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # The engine decides every rating and every table, so a red test must
      # stop the deploy rather than quietly publishing a wrong ladder.
      - name: Test
        run: npm test

      # `base` has to match the repository name for Pages project sites, which
      # serve from /<repo>/. Taking it from the context means renaming or
      # forking the repo cannot silently break every asset path.
      - name: Build
        run: npx vite build --base=/${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
